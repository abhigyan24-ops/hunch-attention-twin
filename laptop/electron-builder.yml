appId: com.dhyan.app
productName: Dhyan
directories:
  output: dist-installer
  buildResources: build
files:
  - out/**
  - package.json
asar: true
extraResources:
  - from: ../engine/dist/dhyan-engine
    to: engine
    filter: ["**/*"]
  - from: ../vscode-ext/dhyan.vsix
    to: companions/dhyan.vsix
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: Dhyan-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
publish:
  provider: github
  owner: abhigyan
  repo: dhyan
  releaseType: release

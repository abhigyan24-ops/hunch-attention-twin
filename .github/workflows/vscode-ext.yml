name: VS Code Extension CI

on:
  push:
    branches: [ main ]
    paths:
      - 'vscode-ext/**'
      - '.github/workflows/vscode-ext.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'vscode-ext/**'
      - '.github/workflows/vscode-ext.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: vscode-ext

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: vscode-ext/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint (TypeScript Typecheck)
        run: npm run lint

      - name: Bundle Extension
        run: npm run compile

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Run Integration Tests
        run: npm run test:integration

# Trigger CI on Node 22 + tsx

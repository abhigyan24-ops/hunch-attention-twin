name: Release Hunch

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'      # pre-releases such as v1.2.0-beta.1
  workflow_dispatch:                    # DRY RUN: builds every artifact, skips the release job

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.10'
  JAVA_VERSION: '17'

jobs:
  # ------------------------------------------------------------------ meta
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_tag: ${{ steps.v.outputs.is_tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            V="$(node -p "require('./laptop/package.json').version")"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Release version: $V (tag run: ${GITHUB_REF})"

  # ------------------------------------------------------------------ verify
  verify:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'   # unit tests do not need the Electron binary
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            laptop/package-lock.json
            vscode-ext/package-lock.json

      - name: Package versions match the release version
        shell: bash
        env:
          V: ${{ needs.meta.outputs.version }}
        run: |
          BASE="${V%%-*}"
          L="$(node -p "require('./laptop/package.json').version")"
          E="$(node -p "require('./vscode-ext/package.json').version")"
          [ "$L" = "$V" ] || { echo "::error file=laptop/package.json::version is $L but release version is $V"; exit 1; }
          [ "$E" = "$BASE" ] || { echo "::error file=vscode-ext/package.json::version is $E but base version is $BASE"; exit 1; }

      - name: Install shared test dependencies
        run: npm ci

      - name: laptop typecheck and tests
        working-directory: laptop
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: vscode-ext typecheck and tests
        working-directory: vscode-ext
        run: |
          npm ci
          npm run lint
          npm run test:unit
          npm run test:integration

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: engine/requirements.lock.txt

      - name: engine tests
        working-directory: engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          python -m pytest -q

  # ------------------------------------------------------------------ engine (PyInstaller)
  engine:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: engine/requirements.lock.txt

      - name: Install pinned dependencies
        working-directory: engine
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          python -m pip show pyinstaller

      - name: Freeze engine (onedir)
        working-directory: engine
        shell: pwsh
        run: pyinstaller dhyan-engine.spec --noconfirm

      - name: Smoke test the frozen engine
        shell: pwsh
        env:
          TWIN_TOKEN: ci-smoke-token
        run: |
          $exe = 'engine\dist\dhyan-engine\dhyan-engine.exe'
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          $p = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden
          $ok = $false
          try {
            for ($i = 0; $i -lt 40; $i++) {
              try { Invoke-RestMethod http://127.0.0.1:8765/health -TimeoutSec 2 | Out-Null; $ok = $true; break }
              catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ok) { throw 'engine did not become healthy on :8765/health' }
            Write-Host 'engine healthy'
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@v4
        with:
          name: engine-win
          path: engine/dist/dhyan-engine
          retention-days: 3
          if-no-files-found: error

  # ------------------------------------------------------------------ VS Code extension
  vsix:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: vscode-ext/package-lock.json

      - name: Build, test and package
        working-directory: vscode-ext
        run: |
          npm ci
          npm run compile
          npm run test:unit
          xvfb-run -a npm run test:e2e
          if [[ "${{ needs.meta.outputs.version }}" == *-* ]]; then
            npm run package -- --out dhyan.vsix --pre-release --skip-license
          else
            npm run package -- --out dhyan.vsix --skip-license
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-vsix
          path: vscode-ext/dhyan.vsix
          retention-days: 3
          if-no-files-found: error

  # ------------------------------------------------------------------ desktop installer
  desktop:
    needs: [meta, engine, vsix]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: laptop/package-lock.json

      - uses: actions/download-artifact@v8
        with:
          name: engine-win
          path: engine/dist/dhyan-engine

      - uses: actions/download-artifact@v8
        with:
          name: release-vsix
          path: vscode-ext

      - name: Install dependencies
        working-directory: laptop
        run: npm ci

      - name: Build installer (signed when secrets exist)
        working-directory: laptop
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if (-not $env:CSC_LINK) { Write-Host '::warning::No Windows signing secrets: building an UNSIGNED installer (SmartScreen will warn)' }
          npm run dist:win

      - name: Verify installer files and bundled engine
        shell: pwsh
        run: |
          $d = 'laptop/dist-installer'
          if (-not (Get-ChildItem -Path $d -Filter 'Hunch-Setup-*.exe' -ErrorAction SilentlyContinue)) { throw "missing Hunch-Setup-*.exe in $d" }
          if (-not (Get-ChildItem -Path $d -Filter 'Hunch-Setup-*.exe.blockmap' -ErrorAction SilentlyContinue)) { throw "missing Hunch-Setup-*.exe.blockmap in $d" }
          if (-not ((Test-Path "$d/latest.yml") -or (Test-Path "$d/beta.yml"))) { throw "missing latest.yml or beta.yml in $d" }
          $engine = "$d/win-unpacked/resources/engine/dhyan-engine.exe"
          if (-not (Test-Path $engine)) { throw "engine not bundled: $engine" }
          Write-Host 'installer files and bundled engine OK'

      - uses: actions/upload-artifact@v4
        with:
          name: release-desktop
          path: |
            laptop/dist-installer/Hunch-Setup-*.exe
            laptop/dist-installer/Hunch-Setup-*.exe.blockmap
            laptop/dist-installer/latest.yml
            laptop/dist-installer/beta.yml
          retention-days: 3
          if-no-files-found: error

  # ------------------------------------------------------------------ android
  android:
    needs: [meta, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          : "${KS_B64:?ANDROID_KEYSTORE_B64 is required}"
          umask 077
          printf '%s' "$KS_B64" | base64 --decode > "$RUNNER_TEMP/dhyan-release.jks"

      - name: Build APK
        working-directory: phone
        shell: bash
        env:
          V: ${{ needs.meta.outputs.version }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/dhyan-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing keystore password}"
          : "${ANDROID_KEY_ALIAS:?Missing signing alias}"
          : "${ANDROID_KEY_PASSWORD:?Missing signing key password}"
          chmod +x gradlew
          BASE="${V%%-*}"
          IFS=. read -r MA MI PA <<< "$BASE"
          export VERSION_NAME="$V"
          export VERSION_CODE=$(( MA*1000000 + MI*10000 + PA*100 ))
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate, verify and name the APK
        shell: bash
        env:
          V: ${{ needs.meta.outputs.version }}
        run: |
          mapfile -t APKS < <(find phone/app/build/outputs/apk -type f -name '*.apk' ! -name '*unsigned*' ! -name '*androidTest*')
          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "::error::expected exactly 1 APK, found ${#APKS[@]}"; printf '%s\n' "${APKS[@]}"; exit 1
          fi
          BT="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          APK="${APKS[0]}"
          test -s "$APK.idsig"
          REPORT=$("$ANDROID_HOME/build-tools/$BT/apksigner" verify --verbose --print-certs --v4-signature-file "$APK.idsig" "$APK")
          printf '%s\n' "$REPORT"
          for scheme in v2 v3 v4; do
            grep -Eq "^Verified using $scheme scheme .*: true$" <<< "$REPORT"
          done
          DIGEST=$(sed -nE 's/^(Signer #[0-9]+ |V[234] Signer: )certificate SHA-256 digest: ([[:xdigit:]]{64})$/\2/p' <<< "$REPORT" | tr '[:upper:]' '[:lower:]' | sort -u)
          EXPECTED="3ec8e983132712b44585e4986378a42beba71bfd48d4d20f3452d3b860d653d4"
          if [[ "${DIGEST,,}" != "$EXPECTED" ]]; then
            echo "::error::Android signer differs from the pinned release certificate"
            exit 1
          fi
          printf '### Android signing\n\nCertificate SHA-256: `%s`\n' "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p out
          cp "$APK" "out/Hunch-${V}.apk"
          cp "$APK.idsig" "out/Hunch-${V}.apk.idsig"

      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/dhyan-release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: |
            out/*.apk
            out/*.apk.idsig
          retention-days: 3
          if-no-files-found: error

  # ------------------------------------------------------------------ release (single publisher, tags only)
  release:
    needs: [meta, desktop, android, vsix]
    if: needs.meta.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*             # excludes the large engine-win artifact
          path: artifacts
          merge-multiple: true

      - name: List and checksum
        working-directory: artifacts
        run: |
          ls -la
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/attest-build-provenance@v2
        continue-on-error: true           # unavailable on private repositories
        with:
          subject-path: 'artifacts/Hunch-*'

      - name: Create DRAFT release
        uses: softprops/action-gh-release@v2
        with:
          draft: true                      # publish manually after a clean-machine test
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/Hunch-Setup-*.exe
            artifacts/Hunch-Setup-*.exe.blockmap
            artifacts/*.yml
            artifacts/Hunch-*.apk
            artifacts/Hunch-*.apk.idsig
            artifacts/dhyan.vsix
            artifacts/SHA256SUMS.txt

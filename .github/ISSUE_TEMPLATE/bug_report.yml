name: Bug report
description: Something is not working
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not paste secrets, API keys, tokens or personal data.** Redact app names, file paths and message text if they are sensitive.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [Laptop Desktop app, Android Phone app, VS Code extension, Engine, Relay, Installer / update, Documentation]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "v1.0.0-beta.1"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and device
      placeholder: "Windows 11 23H2 / Oppo Reno 14, Android 15"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or diagnostics
      render: text

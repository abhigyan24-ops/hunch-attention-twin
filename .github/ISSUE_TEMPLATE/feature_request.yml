name: Feature request
description: Suggest an architectural or functional improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This feature adheres to the Privacy Contract and does NOT require capturing raw message content, screen pixels, keystrokes, URLs, or adding telemetry.
          required: true

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dhyan-engine"
version = "0.1.0"
description = "Attention Digital Twin Causal Inference Engine for Dhyan"
authors = [{ name = "Dhyan Team" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "numpy>=1.24.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.4.0",
    "statsmodels>=0.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = [".."]
